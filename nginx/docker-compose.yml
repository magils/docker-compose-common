services:
  nginx:
    image: nginx:latest
    container_name: nginx-instace
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx.conf.d:/etc/nginx/conf.d:ro
    - ./www:/var/www/html:ro:ro
    - nginx_logs:/var/log/nginx

volumes:
  nginx_logs:
    driver: local